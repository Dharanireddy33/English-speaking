services:
  - type: web
    name: ai-english-speaking-assistant-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: english_assistant
      - key: FRONTEND_URL
        sync: false
